    .progress-track { height: 7px; border-radius: 50px; background: #dce5f0; overflow: hidden; }

    .story-pane { background: #193451; color: white; padding: 25px; border-radius: var(--radius); position: relative; overflow: hidden; }
    .story-pane::before { content: ''; position: absolute; background: rgba(255,255,255,.045); border: 28px solid rgba(255,255,255,.055); border-radius: 50%; height: 205px; width: 205px; right: -110px; top: -104px; }
    .story-pane h3 { color: white; font-size: 20px; margin: 4px 0 14px; position: relative; }
    .story-pane p { color: #dce9f8; font-size: 15px; line-height: 1.68; margin-bottom: 14px; position: relative; }

    .story-pane .small-label { color: #b5d8ed; }
    .story-quote { border-left: 3px solid #78cfcb; padding-left: 12px; margin-top: 24px; font-weight: 750; color: #fff; position: relative; line-height: 1.52; }
    .task-pane { padding: 25px; border-radius: var(--radius); border: 1px solid var(--line); background: white; }

    .choice-list { display: grid; gap: 10px; }
    .choice { display: flex; gap: 13px; align-items: flex-start; background: #fbfcff; border: 1.5px solid var(--line); padding: 15px; border-radius: 15px; cursor: pointer; transition: border-color .15s, background .15s; }
    .choice:hover { border-color: #9bb4e5; }
    .choice.selected { background: #edf3ff; border-color: #6b90ee; box-shadow: inset 0 0 0 1px #6b90ee; }
    .letter { flex: 0 0 31px; height: 31px; border-radius: 10px; display: inline-grid; place-items: center; background: #e8edf6; font-weight: 850; color: #47617f; }

    .choice-copy { flex: 1; color: var(--text); font-size: 14px; line-height: 1.55; padding-top: 4px; }
    .radio-dot { width: 20px; height: 20px; border: 2px solid #adbcd0; border-radius: 50%; margin-top: 5px; flex: none; }
    .choice.selected .radio-dot { border: 6px solid var(--accent); background: white; }
    .form-label { display: block; font-weight: 800; font-size: 13px; margin: 22px 0 8px; }
    textarea, .text-input { width: 100%; border: 1.5px solid #d6e0ea; border-radius: 13px; background: #fff; color: var(--ink); padding: 13px 15px; outline: none; }

    .field-help { font-size: 12px; color: var(--muted); margin-top: 6px; }

    function restore() {
      const fallback = emptyState();

        const story = SCENARIOS[saved.scenario] ? saved.scenario : null;

        const first = { choiceId: stageIsValid(saved.first || {}, 'firstOptions') ? saved.first.choiceId : '', reason: String(saved.first?.reason || '').slice(0, MAX_REASON_LENGTH) };
        const second = { choiceId: stageIsValid(saved.second || {}, 'secondOptions') ? saved.second.choiceId : '', reason: String(saved.second?.reason || '').slice(0, MAX_REASON_LENGTH) };
        const validFirst = !!first.choiceId && validReason(first.reason);
        const validSecond = !!second.choiceId && validReason(second.reason);
        let phase = ['select','one','two','feedback','report'].includes(saved.phase) ? saved.phase : 'select';
        if (!story) phase = 'select';
        else if (['two','feedback','report'].includes(phase) && !validFirst) phase = 'one';
        else if (['feedback','report'].includes(phase) && !validSecond) phase = 'two';
        const submitted = saved.submitted && typeof saved.submitted.fingerprint === 'string' && typeof saved.submitted.time === 'string'
          ? { fingerprint: saved.submitted.fingerprint, time: saved.submitted.time } : null;
        return { mode: saved.mode, scenario: story, phase, first, second, submitted };
      } catch (_) { return fallback; }

      const stages = [{ id:'first', name:'Початкове рішення', action:'Змінити перше рішення' }, { id:'second', name:'Після зміни обставин', action:'Змінити друге рішення' }];
      return `${progress(75,'Крок 3 із 4')}<div class="page-heading"><div class="eyebrow">Час перевірити гіпотези</div><h2>Які наслідки можуть мати твої рішення?</h2><p>Ти зробив / зробила два вибори. Тепер порівняй їхні можливі наслідки. Якщо потрібно — зміни відповідь до формування звіту.</p></div>
      <div class="feedback-grid">${stages.map(({id,name,action},i) => { const ch = getChoice(id); const tone = ch?.tone || 'consider'; return `<article class="feedback-card"><span class="small-label">РІШЕННЯ ${i+1}</span><h3>${name}</h3><div class="chosen">${escapeHtml(ch?.text || '—')}</div><div class="reason"><strong>Твоє пояснення:</strong> ${escapeHtml(state[id].reason)}</div><div class="feedback-note ${tone === 'strong' ? '' : tone}"><strong>${tone === 'strong' ? 'Ризики враховано' : tone === 'risky' ? 'Залишається суттєвий ризик' : 'Є що вдосконалити'}</strong><div>${escapeHtml(ch?.feedback || '')}</div></div><button class="btn-link" data-action="edit" data-step="${id}">↶ ${action}</button></article>`; }).join('')}</div>
      <div class="reflect"><span aria-hidden="true">✦</span><div><strong>Що варто запам’ятати:</strong> ${escapeHtml(s.takeaway)}<br>Втрата чи крадіжка не завжди залежить від дій власника. Ми вчимося зменшувати ризики, а не звинувачувати постраждалих.</div></div>
      <div class="action-row"><button class="btn btn-ghost" data-action="back">← Назад</button><span class="spacer"></span><button class="btn btn-primary" data-action="to-report">Сформувати звіт <span aria-hidden="true">→</span></button></div>`;
    }

    function renderReport() {
      const s = SCENARIOS[state.scenario];
      const info = [
        { name: 'Перше рішення', id: 'first', opts: s.firstOptions },
        { name: 'Нова обставина', id: 'second', opts: s.secondOptions }
      ];
      const sent = isCurrentSent();
      return `${progress(100,'Крок 4 із 4')}<div class="report-top"><div class="page-heading"><div class="eyebrow">Твоя робота готова</div><h2>Підсумковий звіт</h2><p>У звіті збережені твої рішення та пояснення. Перевір їх перед надсиланням. Це навчальна робота без балів.</p></div><div class="top-pill">${state.mode === 'group' ? 'Режим команди' : 'Індивідуальна робота'}</div></div>
        <div class="report-block"><span class="small-label">СИТУАЦІЯ</span><h3>${s.icon} ${escapeHtml(s.title)}</h3><p class="fine" style="margin-bottom:0">${escapeHtml(s.conflict)}</p></div>
        ${info.map(({name,id},i) => { const c = getChoice(id); return `<section class="report-block"><h3>${i+1}. ${name}</h3><div class="report-row"><span class="report-key">Твій вибір</span><div class="report-value">${escapeHtml(c?.text || '—')}</div></div><div class="report-row"><span class="report-key">Чому саме так</span><div class="report-value">${escapeHtml(state[id].reason)}</div></div><div class="report-row"><span class="report-key">Зворотний зв'язок</span><div class="report-value">${escapeHtml(c?.feedback || '—')}</div></div></section>`; }).join('')}
        <div class="highlight-summary"><strong>Головний висновок</strong><p>${escapeHtml(s.takeaway)}</p></div>
        ${sent ? `<div class="sent-banner" role="status"><strong>✓ Звіт надіслано у Formspree.</strong><br>Час підтвердженого надсилання: ${escapeHtml(formatDate(state.submitted.time))}. Якщо змінити відповіді, можна надіслати оновлений звіт.</div>` : ''}
        <div class="action-row"><button class="btn btn-ghost" data-action="copy">Копіювати звіт</button><button class="btn btn-ghost" data-action="edit" data-step="first">Редагувати відповіді</button><span class="spacer"></span><button class="btn btn-primary" data-action="open-modal" ${sent ? 'disabled' : ''}>${sent ? '✓ Надіслано' : 'Відправити звіт →'}</button></div>
        <div class="action-row"><button class="btn-link" data-action="home">← Обрати іншу ситуацію</button></div>`;
    }

    function formatDate(iso) {
      try { return new Intl.DateTimeFormat('uk-UA',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso)); } catch (_) { return iso; }
    }
    function render() {
      const s = SCENARIOS[state.scenario];
      if (!s) state.phase = 'select';
      app.innerHTML = state.phase === 'select' ? renderSelect() : state.phase === 'one' ? renderTask('first') : state.phase === 'two' ? renderTask('second') : state.phase === 'feedback' ? renderFeedback() : renderReport();
      persist();
    }
    function reportData(identifier) {
      const s = SCENARIOS[state.scenario];
      const buildEvidence = (stage) => {
        const ch = getChoice(stage);
        return {
          choice_id: state[stage].choiceId,
          chosen_action: ch?.text || '',
          justification: state[stage].reason.trim(),
          feedback: ch?.feedback || '',
          feedback_category: ch?.tone || ''
        };
      };
      return {
        schema_version: '1.0', exercise_id: 'zbd6_rechi_pid_kontrolem', exercise_version: EXERCISE_VERSION,
        class: 6, subject: 'ЗБД', exercise_title: 'Речі під контролем',
        participation_mode: state.mode === 'group' ? 'команда' : 'індивідуально',
        participant: identifier || '(не вказано)',
        variant_id: state.scenario, scenario_title: s.title,
        scenario_context: { initial_situation: s.story, central_problem: s.conflict, changed_circumstances: s.twist },
        evidence: { initial_decision: buildEvidence('first'), changed_circumstances_decision: buildEvidence('second') },
        summary: { learning_conclusion: s.takeaway, is_graded: false }
      };
    }
    function reportText(identifier) {
      return JSON.stringify(reportData(identifier), null, 2);
    }
    function reportReadable() {
      const s = SCENARIOS[state.scenario];
      const first = getChoice('first');
      const second = getChoice('second');
      return `Речі під контролем · ЗБД, 6 клас\nФормат: ${state.mode === 'group' ? 'команда' : 'самостійно'}\nСитуація: ${s.title}\n\n1. Початкове рішення:\n${first?.text}\nПояснення: ${state.first.reason.trim()}\nЗворотний зв’язок: ${first?.feedback}\n\n2. Після зміни обставин:\n${second?.text}\nПояснення: ${state.second.reason.trim()}\nЗворотний зв’язок: ${second?.feedback}\n\nВисновок: ${s.takeaway}`;
    }
    async function copyReport() {
      try {
        if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(reportReadable());
        else {
          const temp = document.createElement('textarea');
          temp.value = reportReadable();
          temp.style.position = 'fixed'; temp.style.opacity = '0';
          document.body.appendChild(temp); temp.select();
          if (!document.execCommand('copy')) throw new Error('copy failed');
          temp.remove();
        }
        notice('Звіт скопійовано.');
        const button = app.querySelector('[data-action="copy"]');
        if (button) { button.textContent = '✓ Скопійовано'; setTimeout(() => { if (button.isConnected) button.textContent = 'Копіювати звіт'; }, 2200); }
      } catch (_) { notice('Не вдалося скопіювати. Можна виділити текст звіту вручну.'); }
    }
    function openModal() {
      if (state.phase !== 'report' || isCurrentSent()) return;
      pendingSnapshot = { fingerprint: fingerprint(), payload: reportData('') };
      lastFocus = document.activeElement;
      const isGroup = state.mode === 'group';
      modal.innerHTML = `<div class="modal-overlay" data-action="close-modal"></div><div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDescription">
        <button type="button" class="modal-close" data-action="close-modal" aria-label="Закрити вікно">×</button>
        <div class="eyebrow">Надсилання звіту</div><h2 id="modalTitle">Майже готово!</h2>
        <p id="modalDescription">${isGroup ? 'Вкажіть назву команди — учитель отримає один спільний звіт.' : 'Вкажи прізвище та ім’я — учитель знатиме, чию роботу перевіряти.'}</p>
        <div class="modal-small"><strong>Ситуація:</strong> ${escapeHtml(SCENARIOS[state.scenario].title)}<br><strong>Звіт:</strong> обидва рішення, пояснення й зворотний зв’язок</div>
        <form id="submissionForm" novalidate>
          <label class="modal-label" for="participantInput">${isGroup ? 'Назва команди' : 'Прізвище та ім’я'} <span aria-hidden="true">*</span></label>
          <input class="text-input" type="text" id="participantInput" name="participant" required minlength="2" maxlength="100" autocomplete="name" placeholder="${isGroup ? 'Наприклад: Команда 2' : 'Наприклад: Коваленко Софія'}" aria-required="true">
          <div id="modalError" class="form-error hidden" role="alert"></div>
          <div class="action-row"><button type="button" class="btn btn-ghost" data-action="close-modal" id="cancelButton">Скасувати</button><span class="spacer"></span><button type="submit" class="btn btn-primary" id="submitButton">Надіслати у Formspree →</button></div>
        </form><p class="field-help" style="margin-top:15px">Надсилаються лише ім’я або назва команди та відповіді у вправі. Надсилання можливе лише з доступом до інтернету.</p></div>`;
      modal.classList.remove('hidden'); modal.setAttribute('aria-hidden','false');
      shell.classList.add('is-blurred'); shell.inert = true;
      document.body.style.overflow = 'hidden';
      modal.querySelector('#participantInput').focus();
    }
    function closeModal() {
      if (sending) return;
      modal.classList.add('hidden'); modal.setAttribute('aria-hidden','true'); modal.innerHTML = '';
      shell.classList.remove('is-blurred'); shell.inert = false;
      document.body.style.overflow = '';
      pendingSnapshot = null;
      if (lastFocus && lastFocus.isConnected) lastFocus.focus();
    }
    function showModalError(message) {
      const el = modal.querySelector('#modalError');
      if (el) { el.textContent = message; el.classList.remove('hidden'); }
    }
    async function sendReport(evt) {
      evt.preventDefault();
      if (sending || !pendingSnapshot) return;
      const nameInput = modal.querySelector('#participantInput');
      const identifier = String(nameInput?.value || '').trim().replace(/\s+/g,' ');
      if (identifier.length < 2) { showModalError('Вкажіть прізвище та ім’я або назву команди (не менше 2 символів).'); nameInput?.focus(); return; }
      if (pendingSnapshot.fingerprint !== fingerprint()) { showModalError('Відповіді змінилися. Закрийте вікно та відкрийте звіт знову.'); return; }
      const btn = modal.querySelector('#submitButton');
      const cancel = modal.querySelector('#cancelButton');
      const x = modal.querySelector('.modal-close');
      const error = modal.querySelector('#modalError');
      error?.classList.add('hidden');
      sending = true;
      btn.disabled = true; cancel.disabled = true; x.disabled = true;
      btn.innerHTML = '<span class="submit-spinner" aria-hidden="true"></span> Надсилаємо…';
      try {
        const data = { ...pendingSnapshot.payload, participant: identifier };
        const form = new FormData();
        form.append('_date', new Date().toISOString());
        form.append('_subject', 'ЗБД · 6 клас · Речі під контролем');
        form.append('_name', identifier);
        form.append('message', JSON.stringify(data, null, 2));
        const response = await fetch(FORMSPREE_URL, { method: 'POST', body: form, headers: { 'Accept': 'application/json' } });
        if (!response.ok) {
          let details = '';
          try { const json = await response.json(); details = json.errors?.map(e => e.message).filter(Boolean).join(' ') || ''; } catch (_) {}
          throw new Error(details || `Сервер повернув помилку ${response.status}.`);
        }
        state.submitted = { fingerprint: pendingSnapshot.fingerprint, time: new Date().toISOString() };
        persist();
        sending = false;
        closeModal();
        render(); notice('Звіт успішно надіслано у Formspree.');
        scrollToTop();
      } catch (error) {
        showModalError('Не вдалося надіслати звіт. Перевірте інтернет-з’єднання та спробуйте ще раз. ' + String(error.message || ''));
        sending = false;
        btn.disabled = false; cancel.disabled = false; x.disabled = false;
        btn.textContent = 'Спробувати ще раз →';
      }
    }

    app.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-action]');
      if (!button || button.disabled) return;
      const action = button.dataset.action;
      if (action === 'mode') { state.mode = button.dataset.mode; persist(); render(); }
      if (action === 'start') {
        state.scenario = button.dataset.scenario;
        state.first = {choiceId:'',reason:''}; state.second = {choiceId:'',reason:''}; state.submitted = null;
        setPhase('one');
      }
      if (action === 'advance') {
        if (state.phase === 'one' && canProceed('first')) setPhase('two');
        else if (state.phase === 'two' && canProceed('second')) setPhase('feedback');
      }
      if (action === 'back') {
        setPhase(state.phase === 'one' ? 'select' : state.phase === 'two' ? 'one' : state.phase === 'feedback' ? 'two' : 'feedback');
      }
      if (action === 'edit') setPhase(button.dataset.step === 'first' ? 'one' : 'two');
      if (action === 'to-report') setPhase('report');
      if (action === 'open-modal') openModal();
      if (action === 'copy') await copyReport();
      if (action === 'home') setPhase('select');
    });
    app.addEventListener('change', (event) => {
      const input = event.target;
      if (input.name !== 'choice') return;
      const step = state.phase === 'one' ? 'first' : state.phase === 'two' ? 'second' : null;
      if (!step) return;
      const field = step === 'first' ? 'firstOptions' : 'secondOptions';
      if (!SCENARIOS[state.scenario][field].some(o => o.id === input.value)) return;
      state[step].choiceId = input.value;
      persist();
      app.querySelectorAll('.choice').forEach(label => label.classList.toggle('selected', label.contains(input)));
      const advance = app.querySelector('#advanceButton');
      if (advance) advance.disabled = !canProceed(step);
    });
    app.addEventListener('input', (event) => {
      if (event.target.id !== 'reasonInput') return;
      const step = state.phase === 'one' ? 'first' : state.phase === 'two' ? 'second' : null;
      if (!step) return;
      state[step].reason = event.target.value.slice(0, MAX_REASON_LENGTH);
      persist();
      const help = app.querySelector('#reasonHelp');
      if (help) { help.textContent = reasonHelp(state[step].reason); help.classList.toggle('is-valid', validReason(state[step].reason)); }
      const advance = app.querySelector('#advanceButton');
      if (advance) advance.disabled = !canProceed(step);
    });
    modal.addEventListener('click', (event) => {
      if (event.target.closest('[data-action="close-modal"]')) closeModal();
    });
    modal.addEventListener('submit', (event) => {
      if (event.target.id === 'submissionForm') sendReport(event);
    });
    document.addEventListener('keydown', (event) => {
      if (modal.classList.contains('hidden')) return;
      if (event.key === 'Escape' && !sending) { event.preventDefault(); closeModal(); return; }
      if (event.key !== 'Tab') return;
      const focusable = Array.from(modal.querySelectorAll('button:not(:disabled), input:not(:disabled)'));
      if (!focusable.length) return;
      const first = focusable[0], last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    });

    render();
  </script>
</body>
</html>
